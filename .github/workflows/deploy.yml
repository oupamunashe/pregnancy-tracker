# Typecheck, test, build and publish to GitHub Pages on every push to main.
# Live at https://oupamunashe.github.io/pregnancy-tracker/
# One-time: Settings → Pages → Source: "GitHub Actions"; Settings → Secrets and variables → Actions →
#   VITE_SUPABASE_URL (https://<project>.supabase.co) and VITE_SUPABASE_ANON_KEY (the anon PUBLIC key, never service_role).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Check the Supabase settings
        # VITE_* values are inlined at BUILD time — without valid ones the site would ship with no login (or "Failed to fetch").
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Add the repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          node -e '
            const url = process.env.VITE_SUPABASE_URL, key = process.env.VITE_SUPABASE_ANON_KEY, bad = [];
            if (!/^https:\/\/[a-z0-9]+\.supabase\.co$/.test(url)) bad.push("VITE_SUPABASE_URL must be exactly https://<project-ref>.supabase.co (no trailing slash, spaces, quotes or /rest/v1 suffix).");
            const parts = key.split("."); let role = "?", ref = "";
            try { const p = JSON.parse(Buffer.from(parts[1], "base64url")); role = p.role; ref = p.ref || ""; } catch {}
            if (role === "service_role") bad.push("VITE_SUPABASE_ANON_KEY is the service_role key — NEVER ship it. Use the anon public key.");
            else if (parts.length === 3 && role !== "anon") bad.push("VITE_SUPABASE_ANON_KEY is not an anon key.");
            if (ref && /^https:/.test(url) && new URL(url).hostname.split(".")[0] !== ref) bad.push(`URL points at project "${new URL(url).hostname.split(".")[0]}" but the key belongs to "${ref}".`);
            if (bad.length) { bad.forEach(b => console.log("::error::" + b)); process.exit(1); }
            console.log("Supabase settings look right for project " + new URL(url).hostname.split(".")[0]);'

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
