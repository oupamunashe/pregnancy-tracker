# Builds the Next.js static export (PWA) and publishes it to GitHub Pages on every push to main.
# Live at: https://oupamunashe.github.io/pregnancy-tracker/
#
# One-time setup (repo Settings):
#   1. Pages → Build and deployment → Source: "GitHub Actions"
#   2. Secrets and variables → Actions → New repository secret:
#        NEXT_PUBLIC_SUPABASE_URL        https://gvwwwcqwudzygabzbrea.supabase.co
#        NEXT_PUBLIC_SUPABASE_ANON_KEY   the "anon public" key (never the service_role key)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Supabase secrets
        # NEXT_PUBLIC_* values are inlined into the static files at BUILD time. Without valid ones the site would ship
        # with no login gate or a broken URL ("Failed to fetch") — so fail here, loudly, instead.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: node scripts/verify-supabase-env.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - uses: actions/configure-pages@v5

      - name: Build static export
        env:
          NEXT_PUBLIC_BASE_PATH: /pregnancy-tracker
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Confirm the Supabase URL was baked into the build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          HOST=$(node -e 'console.log(new URL(process.env.NEXT_PUBLIC_SUPABASE_URL.trim()).host)')
          grep -rl "$HOST" out/_next/static > /dev/null || { echo "::error::Supabase host not found in the built files"; exit 1; }
          echo "OK: build points at $HOST"

      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
